[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mellonella-tse"
version = "0.1.0"
description = "Causal time-domain target speaker extraction (Stage C) for mellonella"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "soundfile>=0.12",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["tse*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = false
warn_redundant_casts = true
ignore_missing_imports = true
files = ["tse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "datasets: tests that need real training datasets to be present locally",
]
