[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mellonella-poc"
version = "0.1.0"
description = "Phase 1 PoC for mellonella — single-target speaker hard-gating filter"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
models = [
    # torch/torchaudio capped at <2.5: deepfilternet 0.5.6 still imports
    # `torchaudio.backend.common.AudioMetaData`, which was removed in 2.5.
    # Bump these together once a fix lands upstream in deepfilternet.
    "torch>=2.2,<2.5",
    "torchaudio>=2.2,<2.5",
    "speechbrain>=1.0",
    "silero-vad>=5.1",
    "deepfilternet>=0.5.6",
    "librosa>=0.10",
    "onnx>=1.16",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
notebook = [
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "ipykernel>=6.29",
]

[project.scripts]
mellonella-poc = "mellonella_poc.cli:main"

[tool.setuptools.packages.find]
include = ["mellonella_poc*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells routinely end with a bare expression to render output;
# imports happen inside cells; assignments are demonstrative not always used.
"notebooks/*.py" = ["B018", "E402", "F401", "F841"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = false
warn_redundant_casts = true
ignore_missing_imports = true
files = ["mellonella_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "models: tests that require heavy ML model dependencies (skipped in lightweight CI)",
]
