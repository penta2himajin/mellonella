<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="mellonella">
  <title>mellonella</title>
  <desc>A simplified geometric mark for the mellonella project: a stylized moth with each side's forewing and translucent hindwing overlapping into a continuous fan, tilted 45°, with ultrasonic sound waves along the body axis (head and tail directions).</desc>
