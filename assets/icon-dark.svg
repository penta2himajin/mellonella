<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="mellonella">
  <title>mellonella</title>
  <desc>A stylized dorsal (pinned-specimen) silhouette of the greater wax moth (Galleria mellonella): forewing and hindwing on each side overlap into a continuous fan, with the male's distinctive concave outer (terminal) forewing margin and the hindwing peeking out below. Long swept-back filiform antennae, tapering abdomen, and flanking ultrasonic sound waves.</desc>
