    </g>
    <g fill="#111111">
      <path d="M33 22 C47 21 55 27 52 31 C46 33 36 32 33 31 Z"/>
      <path d="M31 22 C17 21 9 27 12 31 C18 33 28 32 31 31 Z"/>
      <ellipse cx="32" cy="32" rx="2" ry="12"/>
    </g>
    <g stroke="#111111" stroke-width="1.4" stroke-linecap="round" fill="none">
      <path d="M30.8 20.5 L29.2 18"/>
      <path d="M33.2 20.5 L34.8 18"/>
    </g>
    <g fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round">
      <path d="M27 16 Q32 12 37 16"/>
      <path d="M25 12 Q32 7 39 12" opacity="0.5"/>
      <path d="M27 48 Q32 52 37 48"/>
      <path d="M25 52 Q32 57 39 52" opacity="0.5"/>
