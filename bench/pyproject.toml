[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mellonella-bench"
version = "0.1.0"
description = "Benchmark + evaluation harness for mellonella (docs/benchmarks.md, docs/evaluation.md)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "mellonella-poc",
]

[project.optional-dependencies]
metrics = [
    "pesq>=0.0.4",
    "pystoi>=0.4",
]
hf = [
    "datasets>=2.14",
    "huggingface_hub>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mellonella-bench = "mellonella_bench.runners.run_all:main"

[tool.setuptools.packages.find]
include = ["mellonella_bench*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = false
warn_redundant_casts = true
ignore_missing_imports = true
files = ["mellonella_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "datasets: tests that need real benchmark datasets to be present locally",
    "metrics: tests that need pesq / pystoi installed",
]
