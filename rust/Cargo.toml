[workspace]
resolver = "2"
members = [
    "mellonella-core",
    "mellonella-cli",
    "mellonella-audio-io",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/penta2himajin/mellonella"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = "0.17"
rustfft = "6"
realfft = "3"
rubato = "0.16"
deep_filter = { version = "0.2", default-features = false, features = ["transforms"] }
clap = { version = "4", features = ["derive"] }
hound = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
cpal = "0.15"
crossbeam-channel = "0.5"
ctrlc = "3"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
