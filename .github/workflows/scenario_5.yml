name: scenario-5

on:
  push:
    branches: [main]
  pull_request:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  MELLONELLA_DATA_DIR: ${{ github.workspace }}/data

jobs:
  scenario-5:
    name: scenario_5 (multilingual robustness; MLS + Emilia-YODAS)
    runs-on: ubuntu-latest
    # D-010 Phase 6 part 1.5 (v9) bumped from 45 → 60 minutes to budget
    # for the new MLS train-split cohort prep step. Cold-cache cost on
    # the train path: ~5-10 min per language × 2 (de + fr); test-split
    # prep + Emilia + cohort build still ~10-15 min combined. Total
    # cold-cache ≈ 20-35 min, comfortably within the new 60-min budget
    # but past the old 45-min one. Warm cache (steady state) is
    # unchanged from v8.
    timeout-minutes: 60
    # Fork PRs do not see secrets — skip there so contributors aren't blocked
    # by an obviously-failing required check. Push to main + same-repo PRs run
    # the full thing.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsndfile1 ffmpeg
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            poc/pyproject.toml
            bench/pyproject.toml

      - name: Install poc[models] + bench[hf] (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e "poc[models]"
          pip install -e "bench[hf]"

      - name: Cache HF + SpeechBrain + DFN3 model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/mellonella
            ~/.cache/librosa
            ~/.cache/DeepFilterNet
          key: scenario5-models-v1-${{ runner.os }}-${{ hashFiles('poc/pyproject.toml') }}
          restore-keys: |
            scenario5-models-v1-${{ runner.os }}-

      # Cache covers MLS/Emilia manifests + audio AND the AS-Norm cohort .npz.
      # The key includes the cohort builder script so changes to selection
      # logic (e.g. --skip-top-n behaviour) invalidate the cache and force
      # a rebuild. The dataset modules are hashed for the same reason on the
      # manifest side. v3 bumps the namespace after the cohort-determinism
      # fix landed (mls/emilia prep now lex-sorts speakers + content-hashes
      # clips before slicing) — pre-fix manifests would still be valid CSV
      # but their speaker01..N labels point at different upstream speakers
      # than the new code expects, which would silently corrupt the AS-Norm
      # μ/σ on cache hits. v2 wiped pre-D-010-Phase-4 caches; v3 wiped the
      # initial determinism caches; v4 wipes the sha1-only clip-pick caches
      # after switching to (-clip_length, sha1) sort to keep the SV concat
      # informative; v5 wipes pre-revision-pin caches (mls/emilia.prepare
      # now pin DATASET_REVISION + sort the Emilia *.tar shard list, so v4
      # caches built off the unpinned glob may reference different speakers
      # than the new manifest produces); v6 was the first Phase 6 attempt
      # (top_speakers = 60) — failed, MLS de test has only 30 speakers;
      # v7 was the second attempt (top_speakers = 30, per-language = 25)
      # — failed, MLS fr test has only 18 speakers; v8 saturated the
      # smallest MLS test split (top_speakers = 18, per-language = 15);
      # v9 (Phase 6 part 1.5) splits the MLS prep into a test-split lane
      # (target / other, top_speakers = 18, output: data/mls/<lang>/) and
      # a train-split lane (cohort, top_speakers = 52, output:
      # data/mls_cohort/<lang>/), bumps Emilia top_speakers 18 → 52, and
      # bumps cohort --per-language 15 → 50 — total cohort = 6 langs ×
      # 50 spk = 300 embeddings (vs 90 in v8), reaching the literature
      # 50-100 spk/lang lower bound.
      - name: Cache MLS + Emilia subset materials + AS-Norm cohort
        uses: actions/cache@v4
        with:
          path: data
          key: scenario5-data-v9-${{ runner.os }}-${{ hashFiles('bench/mellonella_bench/datasets/mls.py', 'bench/mellonella_bench/datasets/emilia.py', 'scripts/build_impostor_cohort.py') }}
          restore-keys: |
            scenario5-data-v9-${{ runner.os }}-

      # ---- Prepare per-language subsets ----
      # MLS is ungated — always runs. Emilia-YODAS is gated; only runs when
      # HF_TOKEN is configured. Either path's manifest is reused on warm cache.

      - name: Prepare MLS test-split subsets (de, fr — target / other; en was dropped from MLS at parquet migration)
        run: |
          python -m mellonella_bench.datasets.mls prepare --language de
          python -m mellonella_bench.datasets.mls prepare --language fr

      # D-010 Phase 6 part 1.5: parallel MLS train-split prep, written to
      # a sibling output dir. The train split has 4 500+ speakers per
      # language and is split-disjoint from test by canonical LibriSpeech
      # construction, so the resulting cohort is guaranteed disjoint from
      # the target / other speakers picked by scenario_5_from_manifest.py.
      # `--top-speakers 52` covers the cohort target (50) plus the
      # `--skip-top-n 2` carve-out the cohort builder applies uniformly.
      # `--max-stream 30000` is a defensive upper bound on the streaming
      # window; typical fill is well below this, but train-split clip
      # density per speaker varies. `--max-speakers-seen 60` caps memory
      # at ≤ 60 × 16 clips × ~960 KB/clip ≈ 0.92 GB so the prep stays
      # well inside the 7 GB CI runner budget regardless of how many
      # distinct speakers appear in the streaming window.
      - name: Prepare MLS train-split subsets (de, fr — AS-Norm cohort)
        run: |
          python -m mellonella_bench.datasets.mls prepare \
            --language de --split train \
            --top-speakers 52 \
            --max-stream 30000 \
            --max-speakers-seen 60 \
            --data-dir "${MELLONELLA_DATA_DIR}/mls_cohort"
          python -m mellonella_bench.datasets.mls prepare \
            --language fr --split train \
            --top-speakers 52 \
            --max-stream 30000 \
            --max-speakers-seen 60 \
            --data-dir "${MELLONELLA_DATA_DIR}/mls_cohort"

      - name: Check HF_TOKEN availability
        id: hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HF_TOKEN not set — skipping Emilia-YODAS (ja/ko/zh) prep"
          fi

      - name: Prepare Emilia-YODAS subsets (en, ja, ko, zh-CN)
        if: steps.hf.outputs.have_token == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m mellonella_bench.datasets.emilia prepare --language en
          python -m mellonella_bench.datasets.emilia prepare --language ja
          python -m mellonella_bench.datasets.emilia prepare --language ko
          python -m mellonella_bench.datasets.emilia prepare --language zh-CN

      # ---- AS-Norm impostor cohort (D-010 Phase 2 + Phase 4 cohort-disjoint fix) ----
      # The cohort is part of the cached `data/` tree. We only rebuild it
      # when the cache miss already cost us the manifests as well — once the
      # cache is warm, scenario_5 sees the exact same cohort across runs,
      # which is what makes per-language deltas comparable.
      #
      # The cache key (above) hashes scripts/build_impostor_cohort.py so
      # changes to selection logic auto-invalidate. Adding/removing
      # languages or changing top-K can be forced by bumping the cache key
      # version (v4 → v5).
      #
      # `--skip-top-n 2` matches scenario_5_from_manifest.py's default
      # `--top-speakers 2` so the speakers used as test target / other are
      # carved out of the cohort. For Emilia-YODAS the carve-out is real
      # (target / other and cohort share one manifest; ranks 0-1 vs 2-51).
      # For MLS de / fr the cohort already comes from the train split
      # (data/mls_cohort/<lang>/...), which is split-disjoint from the
      # test split feeding target / other — `--skip-top-n 2` then just
      # drops the lex-first 2 train speakers per language; harmless,
      # avoids per-manifest skip-top-n config in the cohort builder.
      # D-010 Phase 6 part 1.5: `--per-language 50` — 6 langs × 50 spk =
      # 300 cohort embeddings, top-K = 20 = 6.7 % of cohort (within the
      # literature 5-30 % range; lower ratio than v8's 11 %, which is the
      # actual variance-reduction lever for the AS-Norm μ/σ tail).

      - name: Build AS-Norm impostor cohort (skip if cached)
        run: |
          set -euo pipefail
          if [ -f data/cohorts/scenario5_cohort.npz ]; then
            echo "cohort cached at data/cohorts/scenario5_cohort.npz; skipping rebuild"
            if [ -f data/cohorts/scenario5_cohort.json ]; then
              echo "--- cached cohort summary ---"
              cat data/cohorts/scenario5_cohort.json
            fi
            exit 0
          fi
          mkdir -p data/cohorts
          ARGS=()
          # Phase 6 part 1.5: de / fr cohort comes from the train-split
          # manifest, NOT the test-split one used for target / other.
          for lang in de fr; do
            ARGS+=("--manifest" "${lang}=${MELLONELLA_DATA_DIR}/mls_cohort/${lang}/manifest.csv")
          done
          if [ "${{ steps.hf.outputs.have_token }}" = "true" ]; then
            for lang in en ja ko zh-CN; do
              ARGS+=("--manifest" "${lang}=${MELLONELLA_DATA_DIR}/emilia_yodas/${lang}/manifest.csv")
            done
          fi
          python scripts/build_impostor_cohort.py \
            "${ARGS[@]}" \
            --skip-top-n 2 \
            --per-language 50 \
            --output data/cohorts/scenario5_cohort.npz

      # ---- Build the --manifest argument list dynamically and run scenario_5 ----

      - name: Run scenario_5 against all available manifests (with AS-Norm)
        run: |
          set -euo pipefail
          ARGS=()
          for lang in de fr; do
            ARGS+=("--manifest" "${lang}=${MELLONELLA_DATA_DIR}/mls/${lang}/manifest.csv")
          done
          if [ "${{ steps.hf.outputs.have_token }}" = "true" ]; then
            for lang in en ja ko zh-CN; do
              ARGS+=("--manifest" "${lang}=${MELLONELLA_DATA_DIR}/emilia_yodas/${lang}/manifest.csv")
            done
          fi
          # NOTE: --fpr-max held at 0.95 (was 0.7) since Phase 4. An attempt
          # to tighten to 0.55 in PR #28 surfaced that the post-PR-#27
          # cohort still drifts on cache miss (HF *.tar shard glob was
          # unsorted; revision unpinned). Now that PR #28 also lands the
          # revision pin + sorted shard list, the manifest is genuinely
          # idempotent — but we have not yet observed a stable post-pin
          # baseline. Threshold tightening (with --fpr-max < --tpr-min
          # invariant) deferred to a follow-up once one merge to main has
          # populated the v5 cache and CI has demonstrated reproducibility.
          python scripts/scenario_5_from_manifest.py \
            "${ARGS[@]}" \
            --output benchmark_results/scenario_5 \
            --tpr-min 0.30 --fpr-max 0.95 \
            --real-pipeline \
            --as-norm-cohort data/cohorts/scenario5_cohort.npz

      # Stage the cohort summary alongside the scenario outputs so it lands
      # in the same artifact zip the user already downloads. Helps diff cohort
      # composition between runs (D-010 Phase 2 variance investigation).
      - name: Stage cohort summary into scenario_5 results dir
        if: always()
        run: |
          mkdir -p benchmark_results/scenario_5
          if [ -f data/cohorts/scenario5_cohort.json ]; then
            cp data/cohorts/scenario5_cohort.json benchmark_results/scenario_5/cohort_summary.json
          fi

      - name: Upload scenario_5 outputs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-5-results
          path: benchmark_results/scenario_5/
          retention-days: 30
