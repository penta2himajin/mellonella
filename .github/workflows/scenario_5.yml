name: scenario-5

on:
  push:
    branches: [main]
  pull_request:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  MELLONELLA_DATA_DIR: ${{ github.workspace }}/data

jobs:
  scenario-5:
    name: scenario_5 (multilingual robustness; MLS + Emilia-YODAS)
    runs-on: ubuntu-latest
    # D-010 Phase 6 part 1.5 (v10) keeps the 60-minute timeout from the
    # v9 attempt as a safety margin — the v10 architecture (Emilia-YODAS
    # for de / fr cohort instead of MLS train) drops the cold-cache cost
    # back into the v8 range, but Emilia prep on cold cache still spans
    # 6 languages × ~3-5 min each = ~20-30 min, plus cohort build and
    # the scenario_5 run itself. 60 min absorbs slow-shard outliers
    # without flake. Once we have several stable warm-cache runs we can
    # tighten back to 45 min in a follow-up.
    timeout-minutes: 60
    # Fork PRs do not see secrets — skip there so contributors aren't blocked
    # by an obviously-failing required check. Push to main + same-repo PRs run
    # the full thing.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsndfile1 ffmpeg
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            poc/pyproject.toml
            bench/pyproject.toml

      - name: Install poc[models] + bench[hf] (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e "poc[models]"
          pip install -e "bench[hf]"

      - name: Cache HF + SpeechBrain + DFN3 model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/mellonella
            ~/.cache/librosa
            ~/.cache/DeepFilterNet
          key: scenario5-models-v1-${{ runner.os }}-${{ hashFiles('poc/pyproject.toml') }}
          restore-keys: |
            scenario5-models-v1-${{ runner.os }}-

      # Cache covers MLS/Emilia manifests + audio AND the AS-Norm cohort .npz.
      # The key includes the cohort builder script so changes to selection
      # logic (e.g. --skip-top-n behaviour) invalidate the cache and force
      # a rebuild. The dataset modules are hashed for the same reason on the
      # manifest side. v3 bumps the namespace after the cohort-determinism
      # fix landed (mls/emilia prep now lex-sorts speakers + content-hashes
      # clips before slicing) — pre-fix manifests would still be valid CSV
      # but their speaker01..N labels point at different upstream speakers
      # than the new code expects, which would silently corrupt the AS-Norm
      # μ/σ on cache hits. v2 wiped pre-D-010-Phase-4 caches; v3 wiped the
      # initial determinism caches; v4 wipes the sha1-only clip-pick caches
      # after switching to (-clip_length, sha1) sort to keep the SV concat
      # informative; v5 wipes pre-revision-pin caches (mls/emilia.prepare
      # now pin DATASET_REVISION + sort the Emilia *.tar shard list, so v4
      # caches built off the unpinned glob may reference different speakers
      # than the new manifest produces); v6 was the first Phase 6 attempt
      # (top_speakers = 60) — failed, MLS de test has only 30 speakers;
      # v7 was the second attempt (top_speakers = 30, per-language = 25)
      # — failed, MLS fr test has only 18 speakers; v8 saturated the
      # smallest MLS test split (top_speakers = 18, per-language = 15);
      # v9 (Phase 6 part 1.5 first attempt) tried MLS train sourcing for
      # de / fr cohort — failed in CI: 30 000-sample window only surfaced
      # ~32 distinct speakers due to per-speaker locality (~937 clips /
      # spk in MLS train), and bumping the window to ~50 000 blows the
      # CI timeout under HF parquet streaming's ~20 samples / sec rate;
      # v10 (this revision, Phase 6 part 1.5 second attempt) routes the
      # de / fr cohort through Emilia-YODAS DE / FR shards instead —
      # cross-source-disjoint from MLS test by construction (different
      # upstream universes), high speaker density (5 000-sample scan
      # surfaces 52 spk in seconds), and reuses the existing Emilia prep
      # path with no new code surface. Total cohort = 6 langs × 50 spk =
      # 300 embeddings (vs 90 in v8), reaching the literature 50-100
      # spk/lang lower bound.
      - name: Cache MLS + Emilia subset materials + AS-Norm cohort
        uses: actions/cache@v4
        with:
          path: data
          key: scenario5-data-v10-${{ runner.os }}-${{ hashFiles('bench/mellonella_bench/datasets/mls.py', 'bench/mellonella_bench/datasets/emilia.py', 'scripts/build_impostor_cohort.py') }}
          restore-keys: |
            scenario5-data-v10-${{ runner.os }}-

      # ---- Prepare per-language subsets ----
      # MLS is ungated — always runs. Emilia-YODAS is gated; only runs when
      # HF_TOKEN is configured. Either path's manifest is reused on warm cache.

      - name: Prepare MLS test-split subsets (de, fr — target / other; en was dropped from MLS at parquet migration)
        run: |
          python -m mellonella_bench.datasets.mls prepare --language de
          python -m mellonella_bench.datasets.mls prepare --language fr

      - name: Check HF_TOKEN availability
        id: hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HF_TOKEN not set — skipping Emilia-YODAS prep (en, ja, ko, zh-CN coverage AND de/fr AS-Norm cohort)"
          fi

      # D-010 Phase 6 part 1.5 (v10): Emilia-YODAS prep covers all 6 cohort
      # languages. en / ja / ko / zh-CN have always been Emilia-only (no MLS
      # coverage); de / fr are dual-source — target / other still come from
      # the MLS test step above (data/mls/<lang>/), and the AS-Norm cohort
      # for de / fr now also routes through Emilia (data/emilia_yodas/de,fr/),
      # because MLS test is too small (18 spk in fr) to scale the cohort
      # past v8 and MLS train scanning is too slow under per-speaker
      # locality. Cross-source disjoint by construction: MLS test (read
      # audiobook from LibriVox) and Emilia-YODAS (CC-BY YouTube speech)
      # share no upstream speakers.
      - name: Prepare Emilia-YODAS subsets (en, ja, ko, zh-CN, de, fr)
        if: steps.hf.outputs.have_token == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m mellonella_bench.datasets.emilia prepare --language en
          python -m mellonella_bench.datasets.emilia prepare --language ja
          python -m mellonella_bench.datasets.emilia prepare --language ko
          python -m mellonella_bench.datasets.emilia prepare --language zh-CN
          python -m mellonella_bench.datasets.emilia prepare --language de
          python -m mellonella_bench.datasets.emilia prepare --language fr

      # ---- AS-Norm impostor cohort (D-010 Phase 2 + Phase 4 cohort-disjoint fix) ----
      # The cohort is part of the cached `data/` tree. We only rebuild it
      # when the cache miss already cost us the manifests as well — once the
      # cache is warm, scenario_5 sees the exact same cohort across runs,
      # which is what makes per-language deltas comparable.
      #
      # The cache key (above) hashes scripts/build_impostor_cohort.py so
      # changes to selection logic auto-invalidate. Adding/removing
      # languages or changing top-K can be forced by bumping the cache key
      # version (v4 → v5).
      #
      # `--skip-top-n 2` matches scenario_5_from_manifest.py's default
      # `--top-speakers 2` so the speakers used as test target / other are
      # carved out of the cohort. For en / ja / ko / zh-CN the carve-out is
      # real and load-bearing (target / other and cohort share one Emilia
      # manifest; ranks 0-1 vs 2-51). For de / fr the same Emilia manifest
      # serves only as cohort (target / other comes from the disjoint MLS
      # test manifest), so `--skip-top-n 2` is a uniform no-op there —
      # costs us 2 of the 52 prepared Emilia speakers per language, but
      # avoids per-manifest skip-top-n config in the cohort builder.
      # D-010 Phase 6 part 1.5: `--per-language 50` — 6 langs × 50 spk =
      # 300 cohort embeddings, top-K = 20 = 6.7 % of cohort (within the
      # literature 5-30 % range; lower ratio than v8's 11 %, which is the
      # actual variance-reduction lever for the AS-Norm μ/σ tail).

      - name: Build AS-Norm impostor cohort (skip if cached)
        if: steps.hf.outputs.have_token == 'true'
        run: |
          set -euo pipefail
          if [ -f data/cohorts/scenario5_cohort.npz ]; then
            echo "cohort cached at data/cohorts/scenario5_cohort.npz; skipping rebuild"
            if [ -f data/cohorts/scenario5_cohort.json ]; then
              echo "--- cached cohort summary ---"
              cat data/cohorts/scenario5_cohort.json
            fi
            exit 0
          fi
          mkdir -p data/cohorts
          ARGS=()
          # Phase 6 part 1.5 (v10): all 6 cohort languages source from the
          # Emilia-YODAS manifests. de / fr target / other still comes
          # from data/mls/<lang>/ (the test-prep step above), which is
          # cross-source-disjoint from Emilia by construction.
          for lang in de fr en ja ko zh-CN; do
            ARGS+=("--manifest" "${lang}=${MELLONELLA_DATA_DIR}/emilia_yodas/${lang}/manifest.csv")
          done
          python scripts/build_impostor_cohort.py \
            "${ARGS[@]}" \
            --skip-top-n 2 \
            --per-language 50 \
            --output data/cohorts/scenario5_cohort.npz

      # ---- Build the --manifest argument list dynamically and run scenario_5 ----

      - name: Calibrate theta_pass_as_norm against the v10 cohort (Phase 6 Part 2 step 1, observation only)
        if: steps.hf.outputs.have_token == 'true'
        run: |
          set -euo pipefail
          # Sweep AS-Norm theta on the librosa libri1/2/3 default speakers
          # against the v10 cohort (300 embeddings, 6 langs × 50 spk).
          # Outputs land in docs/benchmarks/calibration_as_norm_*.{csv,json}
          # and are staged into the artifact below for diff-against-prior runs.
          # Goal: observe `recommended_theta_pass` so the heuristic 1.5σ default
          # in GatingConfig can be replaced data-drivenly in a follow-up PR.
          python scripts/calibrate.py \
            --use-as-norm \
            --cohort data/cohorts/scenario5_cohort.npz

      - name: Run scenario_5 against all available manifests (with AS-Norm)
        run: |
          set -euo pipefail
          ARGS=()
          for lang in de fr; do
            ARGS+=("--manifest" "${lang}=${MELLONELLA_DATA_DIR}/mls/${lang}/manifest.csv")
          done
          if [ "${{ steps.hf.outputs.have_token }}" = "true" ]; then
            for lang in en ja ko zh-CN; do
              ARGS+=("--manifest" "${lang}=${MELLONELLA_DATA_DIR}/emilia_yodas/${lang}/manifest.csv")
            done
            # AS-Norm cohort is only built when HF_TOKEN is set (all 6
            # cohort languages source from Emilia-YODAS in v10). Without
            # the token we run scenario_5 in the cosine-only path so the
            # de / fr coverage still produces a result instead of failing
            # at cohort load.
            ARGS+=("--as-norm-cohort" "data/cohorts/scenario5_cohort.npz")
          fi
          # Phase 6 Part 2 step 2 closeout: per-language-mean check
          # (replaces per-row check). Per-row metrics on scenario_5 are
          # unreproducible across runner CPU classes — for the SAME
          # `zh-CN_speaker02_vs_speaker20` sample with a SHA256-identical
          # cohort, gate_fpr at snr=15 mode=other landed at 0.087 / 0.136
          # / 0.200 / 0.400 across four observations (D-010 Phase 6 Part 2
          # decisions.md). Per-language mean over (item, snr) pairs is far
          # more stable. Observed per-language ranges across the same
          # four runs:
          #   zh-CN: TPR mean 0.503-0.659, FPR mean 0.084-0.184
          #   ko:    TPR mean 0.692-0.782, FPR mean 0.000-0.098
          #   de:    TPR mean 0.707-0.798, FPR mean 0.000-0.068
          #   en:    TPR mean 0.623-0.700, FPR mean 0.000
          #   fr:    TPR mean 0.787-0.819, FPR mean 0.000
          #   ja:    TPR mean 0.821-0.872, FPR mean 0.000-0.017
          #
          # Thresholds:
          #   --tpr-mean-min 0.40  (worst language-mean observed 0.503,
          #                         ~25% margin; catches catastrophic
          #                         per-language regressions)
          #   --fpr-mean-max 0.30  (worst observed 0.184, ~63% margin)
          #
          # The `--fpr-mean-max < --tpr-mean-min` invariant (Phase 5
          # closeout goal) is now satisfied (0.30 < 0.40).
          python scripts/scenario_5_from_manifest.py \
            "${ARGS[@]}" \
            --output benchmark_results/scenario_5 \
            --tpr-mean-min 0.40 --fpr-mean-max 0.30 \
            --real-pipeline

      # Stage the cohort summary alongside the scenario outputs so it lands
      # in the same artifact zip the user already downloads. Helps diff cohort
      # composition between runs (D-010 Phase 2 variance investigation).
      - name: Stage cohort + calibration summaries into scenario_5 results dir
        if: always()
        run: |
          mkdir -p benchmark_results/scenario_5
          if [ -f data/cohorts/scenario5_cohort.json ]; then
            cp data/cohorts/scenario5_cohort.json benchmark_results/scenario_5/cohort_summary.json
          fi
          # Phase 6 Part 2 step 1: include the v10 AS-Norm calibration
          # observation alongside scenario_5 outputs so reviewers can read
          # `recommended_theta_pass` directly from the artifact.
          if [ -f docs/benchmarks/calibration_as_norm_summary.json ]; then
            cp docs/benchmarks/calibration_as_norm_summary.json benchmark_results/scenario_5/calibration_as_norm_summary.json
          fi
          if [ -f docs/benchmarks/calibration_as_norm_results.csv ]; then
            cp docs/benchmarks/calibration_as_norm_results.csv benchmark_results/scenario_5/calibration_as_norm_results.csv
          fi

      - name: Upload scenario_5 outputs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-5-results
          path: |
            benchmark_results/scenario_5/
            !benchmark_results/scenario_5/_workdir/**
          retention-days: 30
