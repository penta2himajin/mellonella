name: Rust

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: cargo check / fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Linux build deps (cpal + eframe + tray-icon)
        # mellonella-audio-io depends on cpal (ALSA on Linux);
        # mellonella-gui pulls in eframe (winit / wayland / X11) and
        # tray-icon (AppIndicator / GTK). All three need dev headers
        # + pkg-config metadata on top of the runtime libs the
        # runner ships with.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
