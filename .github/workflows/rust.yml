name: Rust

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

defaults:
  run:
    working-directory: rust

jobs:
  # `cargo fmt` needs no Linux dev headers, so we split it into its own
  # job that skips the 12-min apt install. PRs that fail fmt now fail
  # in ~30 s instead of waiting for the full build environment.
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  check:
    name: cargo check / clippy / test
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # mellonella-audio-io depends on cpal (ALSA on Linux);
      # mellonella-gui pulls in eframe (winit / wayland / X11) and
      # tray-icon (AppIndicator / GTK). All three need dev headers
      # + pkg-config metadata on top of the runtime libs the
      # runner ships with. Same caching pattern as accuracy.yml /
      # smoke.yml — cache-apt-pkgs-action tar-restores the installed
      # files so cache hits run in ~30 s instead of ~12 min.
      - name: install Linux build deps (cached; cpal + eframe + tray-icon)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libasound2-dev
            libxkbcommon-dev libxkbcommon-x11-dev
            libwayland-dev
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            libxdo-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace

  windows-cross:
    # mellonella-apo is cfg(windows)-only: on Linux it compiles to an
    # empty cdylib, so the main `check` job above can't catch
    # regressions in its plugin.rs. This job cross-compiles via
    # mingw-w64 to keep the Windows code path honest.
    name: cargo check (x86_64-pc-windows-gnu)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mingw-w64 (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: mingw-w64
          version: 1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: windows-cross
      - name: cargo check -p mellonella-apo (windows-gnu)
        run: cargo check -p mellonella-apo --target x86_64-pc-windows-gnu --all-targets
      - name: cargo clippy -p mellonella-apo (windows-gnu)
        run: cargo clippy -p mellonella-apo --target x86_64-pc-windows-gnu --all-targets -- -D warnings
