name: smoke

on:
  push:
    branches: [main]
  pull_request:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  smoke:
    name: smoke (mellonella-poc end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsndfile1 ffmpeg
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poc/pyproject.toml

      - name: Install poc with [models] extras (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e "poc[models]"

      - name: Cache HF / SpeechBrain / DFN3 model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/mellonella
          key: smoke-models-v1-${{ runner.os }}-${{ hashFiles('poc/pyproject.toml') }}
          restore-keys: |
            smoke-models-v1-${{ runner.os }}-

      - name: Run smoke
        run: python scripts/smoke.py
