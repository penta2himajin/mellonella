name: accuracy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_as_norm_baseline:
        description: "Capture the AS-Norm ci_baseline (D-010 Phase 6 Part 2 step 3b). Restores the v10 cohort cache from scenario_5, runs ci_accuracy with --as-norm-cohort + --update-baseline, and uploads the resulting ci_baseline_as_norm.json as an artifact."
        required: false
        default: false
        type: boolean

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  ci-accuracy:
    name: ci-accuracy (mini scenario_1 vs baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsndfile1 ffmpeg
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            poc/pyproject.toml
            bench/pyproject.toml

      - name: Install poc[models] + bench (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e "poc[models]"
          pip install -e bench

      - name: Cache HF / SpeechBrain / DFN3 / librosa downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/mellonella
            ~/.cache/librosa
            ~/.cache/DeepFilterNet
          key: accuracy-models-v1-${{ runner.os }}-${{ hashFiles('poc/pyproject.toml') }}
          restore-keys: |
            accuracy-models-v1-${{ runner.os }}-

      - name: Run ci-accuracy (compares against docs/benchmarks/ci_baseline.json)
        run: python scripts/ci_accuracy.py

  ci-accuracy-rust:
    name: ci-accuracy Rust core (mini scenario_1 vs rust baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Measures the live Rust core (the mellonella CLI) instead of the
    # mellonella_poc reference — this is the implementation that ships,
    # so its numbers are what the gating-stability work (#117–#120) is
    # judged against. See #121 (closing the Python-vs-Rust measurement
    # gap). Compares against docs/benchmarks/ci_baseline_rust.json.
    steps:
      - uses: actions/checkout@v4

      # libasound2-dev: the CLI links mellonella-audio-io (cpal) even
      # though `process` never opens a device.
      - name: Install system deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsndfile1 ffmpeg libasound2-dev
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            poc/pyproject.toml
            bench/pyproject.toml

      # poc[models] is needed for the one-shot ECAPA ONNX export (torch +
      # speechbrain) and bench supplies si_sdr + the librosa example
      # audio. The rust runner itself shells out to the CLI and does not
      # import mellonella_poc.
      - name: Install poc[models] + bench (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e "poc[models]"
          pip install -e bench

      - name: Cache HF / SpeechBrain / DFN3 / librosa downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/mellonella
            ~/.cache/librosa
            ~/.cache/DeepFilterNet
          key: accuracy-models-v1-${{ runner.os }}-${{ hashFiles('poc/pyproject.toml') }}
          restore-keys: |
            accuracy-models-v1-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build mellonella CLI (release)
        run: cargo build --release -p mellonella-cli --manifest-path rust/Cargo.toml

      # ECAPA: exported from the SpeechBrain checkpoint (embedding-only —
      # the mode the Rust EcapaTdnn expects). VAD: silero ships several
      # ONNX variants in the pip package — the Rust SileroVad wrapper
      # only accepts the standard `silero_vad.onnx` (the `_half` /
      # `_op18` / `_16k` variants drop the `sr` input and fail at
      # runtime), so select it by exact basename rather than glob order.
      # ORT dylib: the onnxruntime wheel bundles libonnxruntime; pick
      # `libonnxruntime.so*`, not the `_providers_shared` sibling.
      - name: Export ECAPA ONNX + resolve VAD ONNX + ORT dylib
        run: |
          set -euo pipefail
          python scripts/export_ecapa_onnx.py export \
            --mode embedding-only \
            --output build/ecapa_tdnn.onnx
          vad_onnx=$(python -c "import silero_vad, glob, os; cands=[p for p in glob.glob(os.path.join(os.path.dirname(silero_vad.__file__), '**', '*.onnx'), recursive=True) if os.path.basename(p) == 'silero_vad.onnx']; print(cands[0])")
          ort_dylib=$(python -c "import onnxruntime, glob, os; cands=[p for p in glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__), '**', 'libonnxruntime*'), recursive=True) if os.path.basename(p).startswith('libonnxruntime.so')]; print(cands[0])")
          echo "MELLONELLA_ECAPA_ONNX=$PWD/build/ecapa_tdnn.onnx" >> "$GITHUB_ENV"
          echo "MELLONELLA_VAD_ONNX=$vad_onnx" >> "$GITHUB_ENV"
          echo "ORT_DYLIB_PATH=$ort_dylib" >> "$GITHUB_ENV"
          echo "resolved VAD_ONNX=$vad_onnx ORT_DYLIB=$ort_dylib"

      - name: Run ci-accuracy --engine rust (vs docs/benchmarks/ci_baseline_rust.json)
        run: python scripts/ci_accuracy.py --engine rust

  ci-accuracy-as-norm:
    name: ci-accuracy AS-Norm (mini scenario_1 vs as-norm baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Fork PRs do not see secrets and the cohort artifact download requires
    # the repo's GITHUB_TOKEN with read access. Skip there so contributors
    # are not blocked by an obviously-failing required check. Push to main
    # + same-repo PRs run the full thing.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsndfile1 ffmpeg
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            poc/pyproject.toml
            bench/pyproject.toml

      - name: Install poc[models] + bench (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e "poc[models]"
          pip install -e bench

      - name: Cache HF / SpeechBrain / DFN3 / librosa downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/mellonella
            ~/.cache/librosa
            ~/.cache/DeepFilterNet
          key: accuracy-models-v1-${{ runner.os }}-${{ hashFiles('poc/pyproject.toml') }}
          restore-keys: |
            accuracy-models-v1-${{ runner.os }}-

      # Same artifact-download path as the workflow_dispatch baseline-capture
      # job below — the v10 cohort is owned by scenario_5.yml and we read
      # it from its latest successful main artifact.
      - name: Fetch v10 cohort from latest scenario_5 main artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/cohorts
          run_id=$(gh run list \
            --workflow scenario_5.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::no successful scenario_5 main run found to download from" >&2
            exit 1
          fi
          echo "downloading scenario-5-results from run_id=$run_id"
          gh run download "$run_id" \
            --name scenario-5-results \
            --dir /tmp/scenario5-art \
            --repo "${GITHUB_REPOSITORY}"
          if [ ! -f /tmp/scenario5-art/scenario5_cohort.npz ]; then
            echo "::error::scenario5_cohort.npz missing from artifact (latest run_id=$run_id)" >&2
            echo "::error::scenario_5.yml staging step needs to include the .npz; rerun scenario_5 on main." >&2
            ls -la /tmp/scenario5-art/ >&2 || true
            exit 1
          fi
          cp /tmp/scenario5-art/scenario5_cohort.npz data/cohorts/scenario5_cohort.npz
          ls -la data/cohorts/

      - name: Run ci-accuracy in AS-Norm mode (compares against docs/benchmarks/ci_baseline_as_norm.json)
        run: |
          python scripts/ci_accuracy.py \
            --as-norm-cohort data/cohorts/scenario5_cohort.npz

  ci-accuracy-as-norm-baseline:
    name: ci-accuracy AS-Norm baseline capture (workflow_dispatch only)
    if: github.event_name == 'workflow_dispatch' && inputs.capture_as_norm_baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsndfile1 ffmpeg
          version: 1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            poc/pyproject.toml
            bench/pyproject.toml

      - name: Install poc[models] + bench (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e "poc[models]"
          pip install -e bench

      - name: Cache HF / SpeechBrain / DFN3 / librosa downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/mellonella
            ~/.cache/librosa
            ~/.cache/DeepFilterNet
          key: accuracy-models-v1-${{ runner.os }}-${{ hashFiles('poc/pyproject.toml') }}
          restore-keys: |
            accuracy-models-v1-${{ runner.os }}-

      # We tried `actions/cache/restore@v4` against scenario_5.yml's cohort
      # cache key first, but the same key that scenario_5.yml was actively
      # restoring on main produced "Cache not found" from a workflow_dispatch
      # job on the same commit (runs 25442641541 + 25443677600). Cache
      # cross-job visibility is fragile enough that we switched to the
      # artifact route: scenario_5.yml stages `scenario5_cohort.npz` into
      # the existing `scenario-5-results` artifact, and we fetch it from
      # the latest successful scenario_5 main run via `gh run download`.
      - name: Fetch v10 cohort from latest scenario_5 main artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/cohorts
          run_id=$(gh run list \
            --workflow scenario_5.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::no successful scenario_5 main run found to download from" >&2
            exit 1
          fi
          echo "downloading scenario-5-results from run_id=$run_id"
          gh run download "$run_id" \
            --name scenario-5-results \
            --dir /tmp/scenario5-art \
            --repo "${GITHUB_REPOSITORY}"
          if [ ! -f /tmp/scenario5-art/scenario5_cohort.npz ]; then
            echo "::error::scenario5_cohort.npz missing from artifact (latest run_id=$run_id)" >&2
            echo "::error::scenario_5.yml staging step needs to include the .npz; rerun scenario_5 on main." >&2
            ls -la /tmp/scenario5-art/ >&2 || true
            exit 1
          fi
          cp /tmp/scenario5-art/scenario5_cohort.npz data/cohorts/scenario5_cohort.npz
          ls -la data/cohorts/

      - name: Capture ci_baseline_as_norm.json
        run: |
          python scripts/ci_accuracy.py \
            --as-norm-cohort data/cohorts/scenario5_cohort.npz \
            --update-baseline

      - name: Upload ci_baseline_as_norm.json
        uses: actions/upload-artifact@v4
        with:
          name: ci-baseline-as-norm
          path: docs/benchmarks/ci_baseline_as_norm.json
          retention-days: 30
